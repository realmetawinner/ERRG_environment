<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다 속 이야기</title>
    <style>
        /* CSS 스타일: 바다 속 판타지 테마
        */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        body {
            /* 짙은 바다색 그라데이션 배경 */
            background: linear-gradient(to bottom, #023a59, #002235);
            color: #ffffff; /* 기본 텍스트 색상 (흰색) */
            font-family: 'Gowun Dodum', 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.25); /* 반투명 검은색 배경 */
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* 1. 제목 */
        h1 {
            font-size: 2.5em;
            color: #76dfff; /* 밝은 아쿠아 색상 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
        }

        /* 2. 본문 텍스트 */
        p {
            font-size: 1.2em;
            line-height: 1.7;
            margin: 10px 0;
        }

        /* 3. 이미지 */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 25px 0;
            border: 3px solid #76dfff; /* 제목과 어울리는 테두리 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* 4. 버튼 */
        .mission-btn {
            background-color: #ff5722; /* 산호초를 연상시키는 주황색 */
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-family: 'Gowun Dodum', 'Arial', sans-serif;
        }

        .mission-btn:hover {
            background-color: #e64a19; /* 호버 시 더 짙은 주황색 */
            transform: scale(1.05); /* 살짝 커지는 효과 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>사라진 산호초의 비밀</h1>

        <p>흰동가리가 방향 감각을 잃게된 이유는</p>
        <p>산호초들이 모두 색을 잃었기 때문이야.</p>
        <p>지구 온난화로 인해서</p>
        <p>산호초들이 하얗게 변해버렸어.</p>
        
        <img src="images/success/success-fish.png" alt="미션 성공 이미지">
        
        <button class="mission-btn" onclick="location.href='final-mission.html'">
            미션완료
        </button>
    </div>

</body>
</html>
