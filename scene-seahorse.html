<!DOCTYPE html>
<html lang="en">
<head>
    </head>
<body>
<iframe
  id="arIframe"
  src="https://realmetawinner.8thwall.app/ar-person-seahorse/"
  allowfullscreen
  allow="camera; microphone; geolocation; accelerometer; magnetometer; gyroscope; autoplay; clipboard-read; clipboard-write; fullscreen"
></iframe>

<script>
    // 🚨 핵심: 부모 창에서 iframe으로부터 오는 메시지를 수신합니다.
    window.addEventListener('message', function(event) {
        // 보안 검사: 메시지의 출처(Origin)가 8th Wall 도메인인지 확인 (선택 사항이지만 권장)
        // if (event.origin !== 'https://realmetawinner.8thwall.app') return;

        // 메시지 타입이 AR 네비게이션 메시지인지 확인
        if (event.data && event.data.type === 'AR_NAVIGATE') {
            const path = event.data.path;
            if (path) {
                // 부모 창의 URL을 변경하여 페이지 전환을 수행합니다.
                window.location.assign(path);
            }
        }
    });
</script>
</body>
</html>
