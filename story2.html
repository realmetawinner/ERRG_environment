<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데빌기업 비밀연구소</title>
    <style>
        /* ... (style 태그 내용은 이전과 동일) ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            background: linear-gradient(180deg, #0a0f2c 0%, #000000 100%);
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px; 
            margin: 0 auto;  
            text-align: center;
        }

        h2 {
            font-size: 1.6rem; 
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #ffffff;
        }

        p {
            font-size: 1rem; 
            line-height: 1.7;
            margin-bottom: 40px;
            color: #c0c0c0; 
        }

        .story-image {
            width: 100%; 
            max-width: 400px; 
            height: auto;
            border-radius: 12px; 
            margin-bottom: 25px;
            border: 1px solid #333; 
        }

        .mission-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }
        
        .mission-btn {
            display: flex; 
            justify-content: space-between;
            align-items: center;
            background-color: #f0f4f8; 
            color: #2c3e50; 
            padding: 16px 20px;
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s ease-in-out; 
        }
        
        .mission-btn:not(.completed):hover {
            background-color: #ffffff;
            transform: scale(1.02); 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .mission-btn .arrow {
            font-size: 1.5rem;
            font-weight: bold;
            color: #888;
        }
        
        .mission-btn.completed {
            background-color: #6c757d; 
            color: #ccc; 
            pointer-events: none; 
            cursor: not-allowed;
        }

        .mission-btn.completed .arrow {
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>타임머신을 타고 도착한 이곳은 2025년의 데빌기업의 비밀연구소입니다.</h2>

        <img src="images/story2/school.png" alt="데빌기업 비밀연구소 전경" class="story-image">

        <p>
            중학교처럼 보이는 이곳에서 불법적인 연구를 계속하고 있었던 데빌기업의 비밀을 밝히고, 미래를 구해야 합니다. 
            모든 요원들은 자신만의 미션을 반드시 완수해야 합니다. 사원증을 인식시켜 본인의 미션을 수행하세요.
        </p>

        <nav class="mission-buttons">
            <a href="person1.html" class="mission-btn" id="btn-mission1">
                <span>해마를 구해줘</span>
                <span class="arrow">&gt;</span>
            </a>
            
            <a href="person2.html" class="mission-btn" id="btn-mission2">
                <span>돌고래를 구해줘</span>
                <span class="arrow">&gt;</span>
            </a>

            <a href="person3.html" class="mission-btn" id="btn-mission3">
                <span>거북이를 구해줘</span>
                <span class="arrow">&gt;</span>
            </a>

            <a href="person4.html" class="mission-btn" id="btn-mission4">
                <span>문어를 구해줘</span>
                <span class="arrow">&gt;</span>
            </a>
        </nav>

    </div>

    <script>
        // 버튼 상태를 확인하고 업데이트하는 함수
        function checkMissionStatus() {
            
            // 버튼 하나를 업데이트하는 내부 헬퍼 함수
            function updateMissionButton(buttonId, localStorageKey) {
                const button = document.getElementById(buttonId);
                // [개선] 버튼이 존재하고, 스토리지 값이 '1'일 때만 업데이트
                if (button && localStorage.getItem(localStorageKey) === '1') {
                    button.classList.add('completed');
                    button.querySelector('span:first-child').textContent = '미션 완료';
                } 
                // [추가] 만약 스토리지 값이 '1'이 아니라면 (예: success-fish로 초기화된 경우)
                // 버튼을 원래 상태로 되돌립니다.
                else if (button) {
                    button.classList.remove('completed');
                    // 텍스트도 원래대로 돌려야 합니다. (각 버튼의 원래 텍스트로)
                    // 이 예제에서는 텍스트를 하드코딩합니다.
                    const originalTexts = {
                        'btn-mission1': '해마를 구해줘',
                        'btn-mission2': '돌고래를 구해줘',
                        'btn-mission3': '거북이를 구해줘',
                        'btn-mission4': '문어를 구해줘'
                    };
                    button.querySelector('span:first-child').textContent = originalTexts[buttonId];
                }
            }

            // 모든 버튼에 대해 업데이트 실행
            updateMissionButton('btn-mission1', 'seahorse');
            updateMissionButton('btn-mission2', 'dolphin');
            updateMissionButton('btn-mission3', 'turtle');
            updateMissionButton('btn-mission4', 'octopus');
        }

        // [수정] 'pageshow' 이벤트를 사용합니다.
        window.addEventListener('pageshow', function(event) {
            // 페이지가 표시될 때마다 버튼 상태를 새로고침합니다.
            checkMissionStatus();
        });

    </script>
</body>
</html>
