<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다 속 이야기</title>
    <style>
        /* 기본 스타일 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            
            /* '바다 속 판타지' 테마: 깊은 바다 그라데이션 */
            background: linear-gradient(to bottom, #020024, #090979, #00d4ff);
            color: #ffffff; /* 기본 텍스트 색상을 흰색으로 */
        }

        /* 메인 콘텐츠 컨테이너 */
        .container {
            max-width: 600px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.3); /* 반투명 검은색 배경 */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 1. 제목 스타일 */
        h1 {
            font-size: 2.5em; /* 폰트 크기 */
            font-weight: bold;
            color: #90ee90; /* 밝은 연두색으로 판타지 느낌 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* 그림자 효과 */
            margin-bottom: 25px;
        }

        /* 2. 본문 텍스트 스타일 */
        p {
            font-size: 1.2em;
            line-height: 1.7; /* 줄 간격 */
            color: #f0f8ff; /* 앨리스 블루 (부드러운 흰색) */
            margin-bottom: 30px;
        }

        /* 3. 이미지 스타일 */
        img {
            max-width: 80%; /* 컨테이너 크기에 맞게 조절 */
            height: auto;
            border-radius: 10px;
            border: 3px solid #ffffff; /* 흰색 테두리 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* 그림자 */
            margin-bottom: 30px;
        }

        /* 4. 버튼 스타일 */
        .mission-button {
            background-color: #ff6347; /* 산호색 (Tomato) */
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none; /* 링크 스타일 제거 */
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .mission-button:hover {
            background-color: #e5533d; /* 호버 시 살짝 어둡게 */
            transform: scale(1.05); /* 살짝 확대되는 효과 */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h1>슬픈 문어의 이야기</h1>

        <p>
            데빌 기업이 운영하는 공장에서<br>
            흘려보낸 뜨거운 폐수로 인해<br>
            바다의 온도가 상승했고,<br>
            그 결과로 문어는<br>
            알들을 모두 잃고 말았습니다.
        </p>

        <img src="images/success/success-octopus.png" alt="슬퍼하는 문어">

        <button class="mission-button" onclick="window.location.href='story3.html'">
            미션완료
        </button>

    </div>

    // 미션 클리어 확인용 변수 추가 부분
    <script>
        // 'octopus' 변수의 상태를 '1'로 플래그
        localStorage.setItem('octopus', '1');
    </script>

</body>
</html>
