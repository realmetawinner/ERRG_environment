<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>세번째요원AR인식</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- <link rel="stylesheet" href="css/ar-style.css"> -->
    
    <style>
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none; /* ▼ 수정: 처음에는 버튼 컨테이너를 숨김 */
        }
        #action-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
        }
        /* :disabled 스타일은 더 이상 필요 없으므로 제거했습니다. */
    </style>
</head>
<body>

    <a-scene embedded vr-mode-ui="enabled: false;" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker id="ar-marker" type='pattern' url='person3.patt'>
            
            <a-image 
                src="images/overlay-person.png" 
                rotation="-90 0 0" 
                scale="5 5 5"
                position="0 0.1 0">
            </a-image>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="button-container">
        <!-- ▼ 수정: 'disabled' 속성 제거 -->
        <button id="action-button">나의 미션으로 이동</button>
    </div>

    <!-- <script src="js/ar-logic.js"></script> -->

    <!-- ▼ 수정된 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const actionButton = document.getElementById('action-button');
            const buttonContainer = document.querySelector('.button-container'); // 버튼 컨테이너 선택
            const arMarker = document.getElementById('ar-marker');

            let hasMarkerBeenFound = false; // ▼ 추가: 마커를 찾았는지 여부를 추적하는 플래그

            // --- 버튼 클릭 이벤트 ---
            if (actionButton) {
                actionButton.addEventListener('click', function() {
                    window.location.href = 'scene-turtle.html';
                });
            }

            // --- AR 마커 이벤트 리스너 ---
            if (arMarker) {
                // 'markerFound' 이벤트: 마커가 인식되었을 때
                arMarker.addEventListener('markerFound', () => {
                    // ▼ 수정: 마커를 *처음* 찾았을 때만 실행
                    if (!hasMarkerBeenFound) {
                        console.log('마커를 처음 찾았습니다! 버튼을 활성화합니다.');
                        hasMarkerBeenFound = true; // 플래그를 true로 설정
                        
                        if (buttonContainer) {
                            buttonContainer.style.display = 'block'; // 버튼 컨테이너를 보이게 함
                        }
                    }
                });

                // ▼ 'markerLost' 이벤트 리스너를 제거하여,
                // 마커를 잃어도 버튼이 사라지지 않게 합니다.

            } else {
                console.error('AR 마커 요소를 찾을 수 없습니다 (id="ar-marker")');
            }
        });
    </script>
</body>
</html>
