<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>세번째 요원 AR 인식</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none; /* 처음에는 버튼 컨테이너를 숨김 */
        }
        #action-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
        }
    </style>
</head>
<body>

    <a-scene embedded vr-mode-ui="enabled: false;" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker id="ar-marker3" type='pattern' url='person3.patt'>
            
            <a-image 
                src="images/overlay-person.png" rotation="-90 0 0" 
                scale="5 5 5"
                position="0 0.1 0">
            </a-image>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="button-container">
        <button id="action-button">미션 확인하기</button>
    </div>

    <script>
        window.addEventListener('load', function () {
            // ▼ 수정: 'ar-marker3'을 참조
            const marker = document.getElementById('ar-marker3'); 
            const button = document.getElementById('action-button');
            const buttonContainer = document.querySelector('.button-container');
            
            let hasMarkerBeenFound = false;

            if (marker) {
                marker.addEventListener('markerFound', function() {
                    if (!hasMarkerBeenFound) {
                        console.log('Person 3 마커를 찾았습니다! 버튼을 활성화합니다.'); 
                        hasMarkerBeenFound = true; 
                        
                        if (buttonContainer) {
                            buttonContainer.style.display = 'block';
                        }
                    }
                });
            } else {
                console.error('AR 마커 요소 (ar-marker3)를 찾을 수 없습니다.'); 
            }
            
            button.addEventListener('click', function() {
                console.log('버튼이 클릭되었습니다!');
                // ▼ 수정: 이동 페이지는 page3.html
                window.location.href = 'scene-turtle.html'; 
            });
            
            const overlayEntity = marker ? marker.querySelector('a-image') : null;
            const scene = document.querySelector('a-scene');

            if (scene && overlayEntity) {
                scene.addEventListener('tock', function() {
                    if (marker.object3D.visible) {
                        overlayEntity.object3D.rotation.set(0, 0, 0);
                    }
                });
            }
        });
    </script>
</body>
</html>
