<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해마의 위기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body {
            /* 바다 속 느낌의 그라데이션 배경 */
            background: linear-gradient(to bottom, #003973, #005f9e, #3a9cbf);
            color: #ffffff; /* 텍스트 색상을 흰색으로 */
            font-family: 'Poor Story', cursive; /* 폰트 적용 */
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.2); /* 반투명 배경으로 콘텐츠 가독성 확보 */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em; /* 폰트 크기를 키움 */
            color: #f0e68c; /* 제목 색상 (연한 노란색) */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* 텍스트 그림자 */
            margin-bottom: 20px;
        }

        p {
            font-size: 1.4em; /* 본문 폰트 크기 */
            line-height: 1.8; /* 줄 간격 */
            margin-bottom: 30px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px; /* 이미지 모서리를 둥글게 */
            border: 3px solid #f0e68c; /* 이미지 테두리 */
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.5em;
            font-family: 'Poor Story', cursive; /* 버튼에도 폰트 적용 */
            color: #003973; /* 버튼 텍스트 색상 (진한 파랑) */
            background-color: #f0e68c; /* 버튼 배경색 (연한 노랑) */
            border: none;
            border-radius: 50px; /* 둥근 버튼 모양 */
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .button:hover {
            background-color: #fffacd; /* 호버 시 밝은 노란색 */
            transform: scale(1.05); /* 호버 시 살짝 커지는 효과 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>해마의 슬픈 이야기</h1>

        <p>
            데빌기업은<br>
            <br>
            불법 그물망을 사용해서<br>
            어획을 지속했습니다.<br>
            <br>
            그 결과<br>
            해마들은 꼬리가 잘려나갔습니다.
        </p>

        <img src="images/success/success-seahorse.png" alt="꼬리가 잘린 해마를 돕는 모습">

        <a href="story2.html" class="button">미션완료</a>
    </div>

    // 미션 클리어 확인용 변수 추가 부분
    <script>
        // 'dolphin' 변수의 상태를 '1'로 플래그
        localStorage.setItem('dolphin', '1');
    </script>
    
</body>
</html>
