<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>첫번째요원AR인식</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- <link rel="stylesheet" href="css/ar-style.css"> -->
    
    <style>
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #action-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
        }

        /* ▼ 추가: 비활성화 상태일 때의 버튼 스타일 */
        #action-button:disabled {
            background-color: #cccccc; /* 회색 배경 */
            color: #666666; /* 어두운 글씨 */
            cursor: not-allowed; /* '허용 안 됨' 커서 */
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- 
      'embedded'와 'arjs' 속성은 a-scene이 로드될 때 AR 기능을 초기화합니다.
    -->
    <a-scene embedded vr-mode-ui="enabled: false;" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <!-- 
          id="ar-marker"를 통해 이 마커 요소를 스크립트에서 참조합니다.
          'markerFound'와 'markerLost' 이벤트가 이 요소에서 발생합니다.
        -->
        <a-marker id="ar-marker" type='pattern' url='person1.patt'>
            
            <a-image 
                src="images/overlay-person.png" 
                rotation="-90 0 0" 
                scale="5 5 5"
                position="0 0.1 0">
            </a-image>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="button-container">
        <!-- ▼ 수정: 'disabled' 속성을 추가하여 처음에는 비활성화 상태로 시작 -->
        <button id="action-button" disabled>나의 미션으로 이동</button>
    </div>

    <!-- <script src="js/ar-logic.js"></script> -->

    <!-- ▼ 수정된 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const actionButton = document.getElementById('action-button');
            const arMarker = document.getElementById('ar-marker'); // 마커 요소를 ID로 선택

            // --- 버튼 클릭 이벤트 ---
            // (버튼이 활성화되었을 때만 클릭 이벤트가 동작합니다)
            if (actionButton) {
                actionButton.addEventListener('click', function() {
                    // 버튼이 활성화된 상태에서 클릭되면 페이지 이동
                    window.location.href = 'mission1.html';
                });
            }

            // --- AR 마커 이벤트 리스너 ---
            if (arMarker) {
                // 'markerFound' 이벤트: 마커가 인식되었을 때
                arMarker.addEventListener('markerFound', () => {
                    console.log('마커를 찾았습니다!'); // 디버깅용
                    if (actionButton) {
                        actionButton.disabled = false; // 버튼 활성화
                    }
                });

                // 'markerLost' 이벤트: 마커 인식이 끊겼을 때
                arMarker.addEventListener('markerLost', () => {
                    console.log('마커를 잃었습니다.'); // 디버깅용
                    if (actionButton) {
                        actionButton.disabled = true; // 버튼 비활성화
                    }
                });
            } else {
                console.error('AR 마커 요소를 찾을 수 없습니다 (id="ar-marker")');
            }
        });
    </script>
</body>
</html>
