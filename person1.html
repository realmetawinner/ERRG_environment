<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>사원증 AR 경험</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif; /* 텍스트 가독성을 위한 폰트 설정 */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute; /* AR 창이 배경이 되도록 설정 */
            z-index: 1;
        }
        /* 안내 문구 스타일 */
        #ar-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 중앙 정렬 */
            background-color: rgba(0, 0, 0, 0.7); /* 배경을 어둡게 처리 */
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            z-index: 2; /* AR 창 위에 오버레이 */
        }
    </style>
</head>
<body>

<div id="ar-guide">
    사원증의 얼굴을 인식시켜주세요
</div>

<iframe
  src="https://realmetawinner.8thwall.app/ar-person-seahorse/"
  allowfullscreen
  allow="camera; microphone; geolocation; accelerometer; magnetometer; gyroscope; autoplay; clipboard-read; clipboard-write; fullscreen"
></iframe>

<script>
    // AR 경험이 로딩된 후 (또는 AR 경험 내에서 별도의 로직으로)
    // 이 안내 문구를 숨기거나 제거할 수 있습니다.
    // 예를 들어, 일정 시간 후 자동 숨김 처리:
    // setTimeout(function() {
    //     const guide = document.getElementById('ar-guide');
    //     if (guide) {
    //         guide.style.display = 'none';
    //     }
    // }, 5000); // 5초 후 숨김
</script>
</body>
</html>
