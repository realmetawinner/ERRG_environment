<iframe
  id="arIframe"
  src="https://realmetawinner.8thwall.app/ar-person-seahorse/"
  allowfullscreen
  allow="camera; microphone; geolocation; accelerometer; magnetometer; gyroscope; autoplay; clipboard-read; clipboard-write; fullscreen"
></iframe>

<script>
    // 🚨 핵심: 부모 창에서 이동할 목표 경로를 직접 관리합니다.
    const TARGET_MISSION_PAGE = 'mission-seahorse.html';
    // 또는 절대 URL: const TARGET_MISSION_PAGE = 'https://your-netlify-site.app/mission-seahorse.html';

    window.addEventListener('message', function(event) {
        // 메시지 타입이 'AR_BUTTON_CLICKED'인지 확인
        if (event.data && event.data.type === 'AR_BUTTON_CLICKED') {
            
            // 버튼 클릭 메시지를 받은 후, 정의된 목표 경로로 페이지 전환을 실행합니다.
            window.location.assign(TARGET_MISSION_PAGE);
        }
    });
    
    // 5초 후 안내 문구 숨김 로직 등 다른 스크립트 코드는 여기에 유지됩니다.

</script>
