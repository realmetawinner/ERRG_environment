<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ar-person1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%; 
            overflow: hidden;
            position: relative;
            font-family: sans-serif;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 1; 
        }

        /* 🚨 핵심 수정: 안내 문구를 상단 중앙에 배치 */
        #ar-guide {
            position: absolute;
            top: 20%; /* 🌟 상단에서 20% 위치에 배치 🌟 */
            left: 50%;
            transform: translate(-50%, -50%); /* 중앙 정렬 유지 */
            background-color: rgba(0, 0, 0, 0.8); 
            color: white;
            padding: 25px 40px;
            border-radius: 10px;
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            z-index: 2; /* AR 창 위에 오버레이 */
            pointer-events: none; 
            transition: opacity 0.5s ease-in-out; /* 부드러운 사라짐 효과 추가 */
        }
    </style>
</head>
<body>

<div id="ar-guide">
    사원증의 얼굴을 인식시켜주세요
</div>

<iframe
  src="https://realmetawinner.8thwall.app/ar-person-seahorse/"
  allowfullscreen
  allow="camera; microphone; geolocation; accelerometer; magnetometer; gyroscope; autoplay; clipboard-read; clipboard-write; fullscreen"
></iframe>

<script>
    // 5초(5000ms) 후 안내 문구를 숨기도록 타이머 설정
    setTimeout(function() {
        const guide = document.getElementById('ar-guide');
        if (guide) {
            // display: none 대신 opacity를 0으로 변경하여 부드럽게 사라지게 합니다.
            guide.style.opacity = '0'; 
            // 완전히 사라진 후 DOM에서 제거하여 이벤트 충돌을 방지합니다.
            setTimeout(() => {
                guide.style.display = 'none';
            }, 500); // transition 시간(0.5s)과 맞춥니다.
        }
    }, 5000); 

    // iframe과 부모 HTML 간의 통신 로직 (클릭 후 페이지 전환)
    const TARGET_MISSION_PAGE = 'mission-seahorse.html'; // 목표 HTML 파일명

    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'AR_BUTTON_CLICKED') {
            window.location.assign(TARGET_MISSION_PAGE);
        }
    });
</script>
</body>
</html>
