<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>첫번째요원AR인식</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #action-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a-scene embedded vr-mode-ui="enabled: false;" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker id="ar-marker" type='pattern' url='person1.patt'>
            
            <a-image 
                src="images/overlay-person.png" 
                rotation="-90 0 0" 
                scale="5 5 5"
                position="0 0.1 0">
            </a-image>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="button-container">
        <button id="action-button">나의 미션으로 이동</button>
    </div>

    <script>
        // DOM이 완전히 로드된 후 스크립트가 실행되도록 보장합니다.
        document.addEventListener('DOMContentLoaded', (event) => {
            // 버튼 요소를 ID로 선택합니다.
            const actionButton = document.getElementById('action-button');
            
            // 버튼이 존재하는지 확인합니다.
            if (actionButton) {
                // 'click' 이벤트 리스너를 추가합니다.
                actionButton.addEventListener('click', function() {
                    // 버튼을 클릭하면 'scene-dolphin.html'로 페이지를 이동시킵니다.
                    window.location.href = 'scene-dolphin.html';
                });
            }
        });
    </script>
</body>
</html>
