<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>네번째 요원 AR 인식</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%; 
            overflow: hidden;
            position: relative;
            font-family: sans-serif;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 1; 
        }

        /* 🚨 핵심 수정: 안내 문구 스타일 */
        #ar-guide {
            position: absolute;
            top: 15%; /* 상단에서 15% 위치에 배치 (조금 더 위로) */
            left: 50%;
            transform: translate(-50%, -50%); 
            background-color: rgba(0, 0, 0, 0.8); 
            color: white;
            padding: 15px 20px; /* 패딩을 줄여 너비를 확보 */
            border-radius: 10px;
            
            /* 🌟 글자 크기 수정: 한 줄에 들어가도록 1.1em으로 조정 🌟 */
            font-size: 1.1em; 
            font-weight: bold;
            
            /* 🌟 화면 가로 너비 꽉 채우기 및 텍스트 넘침 방지 🌟 */
            width: 90%; /* 화면 너비의 90%를 차지하도록 설정 */
            max-width: 400px; /* 너무 넓은 화면에서는 최대 너비 제한 */
            white-space: nowrap; /* 텍스트가 줄바꿈되지 않도록 강제 (한 줄 유지 핵심) */
            overflow: hidden; /* 한 줄을 초과하면 숨김 처리 */
            text-overflow: ellipsis; /* 숨겨진 텍스트를 ...로 표시 */
            
            text-align: center;
            z-index: 2; 
            pointer-events: none; 
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>

<div id="ar-guide">
    사원증의 얼굴을 인식시켜주세요
</div>

<iframe
  src="https://realmetawinner.8thwall.app/ar-person-octopus/"
  allowfullscreen
  allow="camera; microphone; geolocation; accelerometer; magnetometer; gyroscope; autoplay; clipboard-read; clipboard-write; fullscreen"
></iframe>

<script>
    // 5초(5000ms) 후 안내 문구를 숨기도록 타이머 설정
    setTimeout(function() {
        const guide = document.getElementById('ar-guide');
        if (guide) {
            guide.style.opacity = '0'; 
            setTimeout(() => {
                guide.style.display = 'none';
            }, 500);
        }
    }, 5000); 

    // iframe과 부모 HTML 간의 통신 로직 (클릭 후 페이지 전환)
    const TARGET_MISSION_PAGE = 'scene-octopus.html'; // 목표 HTML 파일명

    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'AR_BUTTON_CLICKED') {
            window.location.assign(TARGET_MISSION_PAGE);
        }
    });
</script>
</body>
</html>
