<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방향감각 상실</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 전체 페이지 스타일 */
        body {
            font-family: 'Gaegu', cursive;
            background-color: skyblue;
            color: #1E272E;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* 콘텐츠를 감싸는 컨테이너 */
        .container {
            max-width: 800px;
        }

        /* 텍스트 스타일 */
        p {
            font-size: 1em; /* 폰트 크기 수정 (기존 1.5em에서 1em으로) */
            font-weight: 700;
            line-height: 1; /* 줄 간격 수정 */
            margin-bottom: 40px;
        }

        /* 이미지를 담는 컨테이너 */
        .image-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        /* 이미지 스타일 */
        .image-gallery img {
            max-width: 90%;
            width: 300px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* 텍스트 입력창 스타일 */
        #input-box {
            font-family: 'Gaegu', cursive;
            font-size: 1.5em;
            padding: 10px 15px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #f0f8ff;
            color: #1E272E;
            text-align: center;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px; /* ▼ 추가: 버튼과의 간격 */
        }

        /* 입력창 placeholder 텍스트 스타일 */
        #input-box::placeholder {
            color: #555;
        }

        /* ▼ 추가: 전송 버튼 스타일 */
        #submit-button {
            font-family: 'Gaegu', cursive;
            font-size: 1.5em;
            padding: 10px 20px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #1E272E; /* 어두운 배경 */
            color: #f0f8ff; /* 밝은 텍스트 */
            cursor: pointer; /* 클릭 가능한 커서 */
            transition: background-color 0.3s, color 0.3s;
        }

        /* ▼ 추가: 버튼 호버(hover) 효과 */
        #submit-button:hover {
            background-color: #f0f8ff; /* 밝은 배경 */
            color: #1E272E; /* 어두운 텍스트 */
        }
    </style>
</head>
<body>

    <div class="container">
        <p>모든 곳이 똑같이 느껴져.<br>나는 방향감각을 잃어버렸어.<br>내가 있는 곳이 어딘지 찾아줘.</p>

        <div class="image-gallery">
            <img src="images/mission4/map1.png" alt="현재 위치를 보여주는 지도">
            <img src="images/mission4/map2.png" alt="전체 미로 지도">
        </div>

        <input type="text" id="input-box" placeholder="알파벳을 입력하세요">
        <br> <button id="submit-button">확인</button> </div>

    <script>
        const inputBox = document.getElementById('input-box');
        const submitButton = document.getElementById('submit-button'); // ▼ 추가: 버튼 선택

        // ▼ 수정: 정답 확인 로직을 별도 함수로 분리
        function checkAnswer() {
            if (inputBox.value.toLowerCase() === 'e') {
                window.location.href = 'room2.html';
            }
            // (참고) 틀렸을 때의 동작을 추가할 수 있습니다.
            // else {
            //     alert("틀렸습니다. 다시 시도하세요.");
            //     inputBox.value = ""; // 입력창 비우기
            // }
        }

        // ▼ 수정: Enter 키 이벤트 리스너가 함수를 호출하도록 변경
        inputBox.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });

        // ▼ 추가: 버튼 클릭 이벤트 리스너
        submitButton.addEventListener('click', function() {
            checkAnswer();
        });
    </script>

</body>
</html>
