<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미션 암호</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter 폰트 로드 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 잘못된 암호 입력 시 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">

    <!-- 메인 컨텐츠 컨테이너 -->
    <div id="main-container" class="bg-gray-800 p-8 md:p-12 rounded-2xl shadow-2xl w-full max-w-md text-center">
        
        <!-- 1. 이미지 (원형 및 테두리 제거) -->
        <img 
            src="images/story3.png" 
            alt="스토리 이미지"
            class="w-48 h-48 mx-auto mb-8 object-cover shadow-lg rounded-lg" <!-- 원형(rounded-full) 및 테두리(border-*) 제거, 약간 둥근 모서리(rounded-lg) 추가 -->
            <!-- 이미지 로드 실패 시 자리 표시자 이미지로 대체 -->
            onerror="this.onerror=null; this.src='https://placehold.co/192x192/4A5568/E2E8F0?text=images/story3.png';"
        >

        <!-- 2. 텍스트 -->
        <p class="text-lg text-gray-300 mb-6">
            암호를 입력해 미션을 확인하세요.
        </p>

        <!-- 3. 입력창 및 버튼 -->
        <div class="space-y-4">
            <input 
                type="password" 
                id="passwordInput" 
                class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                placeholder="영어로 입력하세요"
            >
            <button 
                id="submitButton"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
            >
                입력
            </button>
        </div>

        <!-- 오류 메시지 (초기에는 숨김) -->
        <p id="errorMessage" class="text-red-400 text-sm mt-4 hidden">
            암호가 틀렸습니다.
        </p>

    </div>

    <script>
        // DOM 요소 가져오기
        const passwordInput = document.getElementById('passwordInput');
        const submitButton = document.getElementById('submitButton');
        const errorMessage = document.getElementById('errorMessage');
        const mainContainer = document.getElementById('main-container');

        // 암호 확인 함수
        function checkPassword() {
            // 입력된 값 가져오기
            const password = passwordInput.value;

            // 암호 확인
            if (password === "ANGEL") {
                // 성공: scene-fish.html로 이동
                window.location.href = 'scene-fish.html';
            } else {
                // 실패: 오류 메시지 표시 및 애니메이션
                errorMessage.classList.remove('hidden'); // 오류 메시지 보이기
                mainContainer.classList.add('shake'); // 컨테이너 흔들기

                // 애니메이션이 끝난 후 클래스 제거
                setTimeout(() => {
                    mainContainer.classList.remove('shake');
                }, 500);

                // 입력창 비우기
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // 1. 버튼 클릭 시 암호 확인
        submitButton.addEventListener('click', checkPassword);

        // 2. 엔터 키 입력 시 암호 확인
        passwordInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                checkPassword();
            }
            // 키 입력 시 오류 메시지 숨기기
            errorMessage.classList.add('hidden');
        });
    </script>

</body>
</html>
