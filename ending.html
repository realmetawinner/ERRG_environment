<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심해의 신비 - 분리수거 미션</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(to bottom, #001f3f, #000a1a); /* 깊은 바다색 그라데이션 */
            color: #e0f2f7; /* 밝은 청록색 텍스트 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background-color: rgba(173, 216, 230, 0.2); /* 연한 하늘색 */
            border-radius: 50%;
            opacity: 0;
            animation: bubble-rise 15s infinite ease-in;
        }

        @keyframes bubble-rise {
            0% {
                transform: translateY(100vh) scale(0.2);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        .jellyfish {
            position: absolute;
            width: 80px;
            height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%2387CEEB" d="M50,10c-16.5,0-30,13.5-30,30c0,11,6,20.5,15,25.7V90c0,5.5,4.5,10,10,10s10-4.5,10-10V65.7c9-5.2,15-14.7,15-25.7C80,23.5,66.5,10,50,10z"/></svg>'); /* 밝은 파란색 해파리 SVG */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.6;
            animation: jellyfish-swim 20s infinite ease-in-out;
        }
        
        @keyframes jellyfish-swim {
            0% { transform: translate(-10vw, 50vh) scale(0.8); }
            25% { transform: translate(30vw, 30vh) scale(1); }
            50% { transform: translate(70vw, 70vh) scale(0.9); }
            75% { transform: translate(40vw, 10vh) scale(1.1); }
            100% { transform: translate(-10vw, 50vh) scale(0.8); }
        }


        .container {
            text-align: center;
            background-color: rgba(0, 20, 40, 0.7); /* 반투명 어두운 배경 */
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.5); /* 빛나는 그림자 효과 */
            z-index: 10;
            position: relative;
            max-width: 800px;
            margin: 20px;
            animation: fade-in 2s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5em;
            color: #87CEEB; /* 스카이 블루 */
            text-shadow: 0 0 15px rgba(135, 206, 235, 0.8);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.6em;
            line-height: 1.6;
            color: #b0e0e6; /* 파우더 블루 */
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .button {
            display: inline-block;
            background: linear-gradient(45deg, #00BFFF, #1E90FF); /* 깊은 바다색 버튼 */
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.4);
            letter-spacing: 1px;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 191, 255, 0.6);
            background: linear-gradient(45deg, #1E90FF, #00BFFF);
        }

        /* 작은 물고기들 */
        .fish {
            position: absolute;
            width: 50px;
            height: 30px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ADD8E6" d="M20,50c0-16.6,13.4-30,30-30s30,13.4,30,30c0,16.6-13.4,30-30,30S20,66.6,20,50zM80,50l20-10v20L80,50z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            animation: swim-left 10s infinite linear;
            z-index: 5;
        }

        .fish.right {
            animation: swim-right 10s infinite linear;
            transform: scaleX(-1); /* 좌우 반전 */
        }

        @keyframes swim-left {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-20vw); }
        }
        @keyframes swim-right {
            0% { transform: translateX(-20vw) scaleX(-1); }
            100% { transform: translateX(100vw) scaleX(-1); }
        }

    </style>
</head>
<body>
    <div class="background-elements"></div>

    <div class="container">
        <h1>심해의 신비로운 미션</h1>
        <p>이제 여러분은 과거팀과 함께 분리수거 미션을 완성하세요.</p>
        <a href="#" class="button">미션 시작</a>
    </div>

    <script>
        // 배경 요소 (거품) 생성
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            document.querySelector('.background-elements').appendChild(bubble);

            const size = Math.random() * 60 + 20; // 20px - 80px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`; // 화면 전체에 분산
            bubble.style.animationDelay = `${Math.random() * 10}s`; // 딜레이로 비동기 효과
            bubble.style.animationDuration = `${Math.random() * 10 + 10}s`; // 10s - 20s
        }

        for (let i = 0; i < 20; i++) {
            createBubble();
        }

        // 배경 요소 (해파리) 생성
        function createJellyfish() {
            const jellyfish = document.createElement('div');
            jellyfish.classList.add('jellyfish');
            document.querySelector('.background-elements').appendChild(jellyfish);

            const size = Math.random() * 100 + 50; // 50px - 150px
            jellyfish.style.width = `${size}px`;
            jellyfish.style.height = `${size}px`;
            jellyfish.style.left = `${Math.random() * 100}vw`;
            jellyfish.style.top = `${Math.random() * 100}vh`;
            jellyfish.style.animationDelay = `${Math.random() * 10}s`;
            jellyfish.style.animationDuration = `${Math.random() * 15 + 15}s`; // 15s - 30s
        }

        for (let i = 0; i < 3; i++) { // 3마리의 해파리
            createJellyfish();
        }

        // 작은 물고기 생성
        function createFish() {
            const fish = document.createElement('div');
            fish.classList.add('fish');
            document.querySelector('.background-elements').appendChild(fish);

            const size = Math.random() * 30 + 30; // 30px - 60px
            fish.style.width = `${size}px`;
            fish.style.height = `${size * 0.6}px`; // 물고기 형태 고려
            fish.style.top = `${Math.random() * 80 + 10}vh`; // 화면 중앙 위주
            fish.style.animationDuration = `${Math.random() * 8 + 8}s`; // 8s - 16s
            fish.style.animationDelay = `${Math.random() * 5}s`;

            if (Math.random() > 0.5) {
                fish.classList.add('right');
            }
        }

        for (let i = 0; i < 10; i++) { // 10마리의 물고기
            createFish();
        }

    </script>
</body>
</html>
