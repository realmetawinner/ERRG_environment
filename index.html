<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구를 구하라</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        body {
            font-family: 'Gowun Dodum', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #5a4a8c;
            border-radius: 15px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 25px rgba(128, 0, 255, 0.4);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.2em;
            color: #ffffff;
            text-shadow: 0 0 10px #9f78ff, 0 0 20px #9f78ff;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.7;
            color: #c0c0c0;
            margin-bottom: 30px;
        }

        .input-group {
            margin-top: 20px;
        }

        #codeInput {
            font-family: 'Gowun Dodum', serif;
            font-size: 1.2em;
            padding: 12px 15px;
            width: 70%;
            max-width: 300px;
            border: 2px solid #7e57c2;
            border-radius: 8px;
            background-color: #1e1e2f;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 0 15px rgba(126, 87, 194, 0.3);
            transition: all 0.3s ease;
        }

        #codeInput:focus {
            outline: none;
            border-color: #b39ddb;
            box-shadow: 0 0 20px rgba(179, 157, 219, 0.5);
        }

        #submitButton {
            font-family: 'Gowun Dodum', serif;
            font-size: 1.2em;
            padding: 12px 25px;
            margin-left: 10px;
            border: none;
            border-radius: 8px;
            background-color: #7e57c2;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(126, 87, 194, 0.5);
            transition: all 0.3s ease;
        }

        #submitButton:hover {
            background-color: #9575cd;
            box-shadow: 0 0 25px rgba(149, 117, 205, 0.7);
            transform: translateY(-2px);
        }

        /* --- 추가된 스타일 --- */
        /* 오류 메시지를 위한 공간 확보 및 스타일 */
        #message {
            color: #ff6b6b; /* 오류 메시지 색상 */
            margin-top: 15px;
            font-size: 1em;
            font-weight: bold;
            height: 1.2em; /* 메시지 공간을 미리 잡아두어 레이아웃이 밀리지 않게 함 */
        }
        /* --- --- */


        /* 모바일 화면 대응 */
        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 1.8em;
            }
            p {
                font-size: 1em;
            }
            #codeInput {
                width: 90%;
                margin-bottom: 15px;
            }
            #submitButton {
                width: 90%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>위기의 지구</h1>
        <p>
            환경오염이 심각해지면서 해수면은 점점 높아지고,<br>
            지구의 땅은 모두 바다 속에 잠기게 된다.<br>
            이 위기를 구하기 위해 선발된 4명의 요원.<br>
            과연 잃어버린 땅을 되찾을 수 있을까?
        </p>

        <div class="input-group">
            <input type="text" id="codeInput" placeholder="입장 코드를 입력하세요">
            <button id="submitButton" onclick="checkCode()">입력</button>
        </div>
        
        <!-- 오류 메시지가 표시될 위치 -->
        <p id="message"></p>
    </div>

    <script>
        // 메시지 표시 엘리먼트
        const messageEl = document.getElementById('message');
        const codeInputEl = document.getElementById('codeInput');

        function checkCode() {
            // 정답 코드
            const correctCode = "ERRG2025";
            
            // 입력된 값 가져오기
            let inputCode = codeInputEl.value;
            
            // 대소문자 구분 없이 비교 (필요시 toUpperCase() 추가)
            if (inputCode.toUpperCase() === correctCode) {
                // 정답일 경우 story1.html로 이동
                // 참고: 이 환경에서는 다른 HTML 파일로의 이동이 제한될 수 있습니다.
                messageEl.style.color = "#86E57F"; // 성공 색상
                messageEl.textContent = "인증 성공! 엔젤연구소로 이동합니다...";
                // 1초 후 이동 시도
                setTimeout(() => {
                    window.location.href = "story1.html";
                }, 1000);

            } else {
                // --- 수정된 부분 ---
                // alert() 대신 message 엘리먼트에 텍스트 표시
                messageEl.style.color = "#ff6b6b"; // 오류 색상
                messageEl.textContent = "코드가 일치하지 않습니다. 다시 시도하세요.";
                // --- ---
                
                codeInputEl.value = ""; // 입력창 비우기
                codeInputEl.focus(); // 입력창에 다시 포커스
            }
        }

        // Enter 키로도 입력 가능하게 설정
        codeInputEl.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // 기본 Enter 동작 (폼 제출 등) 방지
                document.getElementById('submitButton').click(); // 버튼 클릭 이벤트 실행
            }
        });

        // --- 추가된 부분 ---
        // 사용자가 다시 입력을 시작하면 오류 메시지 지우기
        codeInputEl.addEventListener('input', function() {
            if (messageEl.textContent !== "") {
                messageEl.textContent = "";
            }
        });
        // --- ---
    </script>
</body>
</html>
