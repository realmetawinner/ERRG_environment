<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다 속 이야기</title>
    <style>
        /* Google Fonts에서 부드러운 글꼴 가져오기 */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

        body {
            /* '바다 속 판타지' 테마의 그라데이션 배경 */
            background: linear-gradient(to bottom, #023a59, #005080, #1d8ab8);
            color: #f0f8ff; /* (AliceBlue) - 부드러운 흰색 계열 텍스트 */
            font-family: 'Nunito', sans-serif; /* 부드러운 글꼴 적용 */
            margin: 0;
            padding: 20px;
            min-height: 100vh; /* 화면 전체 높이를 채우도록 설정 */
            display: flex;
            flex-direction: column;
            align-items: center; /* 모든 요소를 중앙 정렬 */
            justify-content: center; /* 수직 중앙 정렬 (내용이 짧을 경우) */
            box-sizing: border-box;
        }

        /* 콘텐츠를 감싸는 메인 컨테이너 */
        .container {
            background-color: rgba(0, 0, 0, 0.25); /* 반투명한 배경 */
            padding: 30px;
            border-radius: 15px; /* 둥근 모서리 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* 입체감 있는 그림자 */
            max-width: 600px; /* 최대 너비 제한 */
            width: 90%;
            text-align: center; /* 내부 요소들 중앙 정렬 */
        }

        /* 1. 제목 스타일 */
        h1 {
            color: #98eff9; /* 밝은 청록색 (판타지 느낌) */
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* 텍스트 그림자 */
        }

        /* 2. 본문 텍스트 스타일 */
        p {
            font-size: 1.15em;
            line-height: 1.7; /* 줄 간격 */
            margin-bottom: 30px;
            color: #ffffff; /* 본문은 더 밝은 흰색 */
        }

        /* 3. 이미지 스타일 */
        .story-image {
            max-width: 100%; /* 컨테이너 너비에 맞춤 */
            height: auto;
            border-radius: 10px; /* 이미지에도 둥근 모서리 */
            border: 3px solid #87cefa; /* (LightSkyBlue) 테두리 */
            margin-bottom: 30px;
        }

        /* 4. 버튼 스타일 */
        .action-button {
            display: inline-block;
            background-color: #ff7f50; /* 산호색 (Coral) */
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none; /* 링크 밑줄 제거 */
            font-weight: bold;
            font-size: 1.2em;
            border-radius: 30px; /* 둥근 버튼 */
            transition: background-color 0.3s, transform 0.2s; /* 부드러운 효과 */
        }

        /* 버튼 호버(마우스 올렸을 때) 효과 */
        .action-button:hover {
            background-color: #ff6347; /* (Tomato) - 조금 더 짙은 색 */
            transform: scale(1.05); /* 살짝 커지는 효과 */
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>돌고래의 침묵</h1>

        <p>
            돌고래는 시끄러운 엔진소리 때문에<br>
            서로 소통을 할 수 없어졌고,<br>
            무리지어 살던 돌고래들은<br>
            더이상 서로 소통하며 함께 살 수 없게 되었어.
        </p>

        <img src="images/success/success-dolphin.png" alt="돌고래 이미지" class="story-image">

        <a href="story2.html" class="action-button">미션완료</a>

    </div>

    <script>
        // 'dolphin' 변수의 상태를 '1'로 플래그
        localStorage.setItem('dolphin', '1');
    </script>

</body>
</html>
